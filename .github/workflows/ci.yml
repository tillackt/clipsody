# Tests, lint, secret scan, the app build and the translation catalog for every push to main and
# every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

# A new push to the same pull request makes its running checks obsolete.
concurrency:
  group: ci-${{ github.ref }}
  # Only pull requests: every commit on main keeps its own result (and code scanning has no gaps).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and secret scan
    # Nothing here needs macOS, and Linux runners start faster.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan covers every commit, not only the newest.
          fetch-depth: 0
      - name: Scan the history for secrets (Betterleaks)
        run: .github/scripts/betterleaks.sh
      # Images are pinned by digest: a re-pushed tag cannot change what runs. Dependabot does not
      # see images inside run steps; bump tag and digest together by hand.
      - name: SwiftLint
        run: docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057 swiftlint lint --strict
      - name: ShellCheck
        run: shellcheck build.sh .github/scripts/*.sh .githooks/pre-commit
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  test:
    name: Tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes; the token must not stay in the checkout.
          persist-credentials: false
      - name: Select the newest stable Xcode
        run: .github/scripts/select-xcode.sh
      - name: Run the unit tests with coverage
        # Fails below 88 % line coverage; the per-file table is in the run's summary.
        run: ./build.sh coverage
        env:
          WARNINGS_AS_ERRORS: "1"

  build:
    name: App build and translations
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      # Pinned to a commit: a moved tag cannot change what runs here; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # build.sh numbers builds by the commit count, which needs the whole history.
          fetch-depth: 0
      - name: Select the newest stable Xcode
        run: .github/scripts/select-xcode.sh
      - name: Check the translation catalog against the code
        run: ./build.sh check-strings
      - name: Build the universal app
        # Without the signing certificate the app is signed ad hoc; build.sh still verifies the signature.
        run: ./build.sh
        env:
          # The code builds without warnings; a new warning fails CI.
          WARNINGS_AS_ERRORS: "1"

  macos-27:
    name: Tests and build on macOS 27
    # The newest macOS and SDK, to catch new deprecations and behaviour early. Not a required check
    # while the image is new; the required checks run on macos-26.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the newest stable Xcode
        run: .github/scripts/select-xcode.sh
      - name: Run the unit tests
        run: ./build.sh test
        env:
          WARNINGS_AS_ERRORS: "1"
      - name: Build the universal app
        run: ./build.sh
        env:
          WARNINGS_AS_ERRORS: "1"
