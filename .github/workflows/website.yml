# Checks the static website: valid HTML and no broken links or anchors. Runs when the website
# changes, and weekly because external links break without any change here.
name: Website

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # Only pull requests: every commit on main keeps its own result (and code scanning has no gaps).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: HTML and links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit like in ci.yml; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the HTML (html-validate, recommended rules)
        # Version pinned; rules in website/.htmlvalidate.json.
        run: npx --yes html-validate@11.17.0 website
      - name: Check links and anchors (lychee)
        # Pinned by digest like the images in ci.yml. 429 (rate limited) counts as reachable, so the
        # weekly run does not fail on throttling; the DMG link is checked too. gnu.org (the licence
        # link) lets requests from GitHub's runners time out, so it is skipped.
        run: >
          docker run --rm -v "$PWD:/input" -w /input
          lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
          --no-progress --include-fragments --max-retries 3 --accept '200..=299,429'
          --exclude '^https://www\.gnu\.org/'
          'website/**/*.html'
