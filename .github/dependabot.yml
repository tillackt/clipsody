# Keeps the GitHub Actions used by the workflows up to date. Actions are pinned to commit SHAs;
# Dependabot updates the SHA and the version comment next to it in one pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "CI"
    groups:
      github-actions:
        patterns: ["*"]
