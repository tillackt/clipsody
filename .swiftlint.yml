# SwiftLint configuration. CI runs `swiftlint lint --strict`, so every warning fails the build.
included:
  - Sources
  - Tests
  - Package.swift

disabled_rules:
  # Multi-line literals end with a trailing comma in this project, so adding an element touches one line.
  - trailing_comma
  # Multiple trailing closures (SE-0279) are idiomatic Swift; the rule predates them.
  - multiple_closures_with_trailing_closure

# Rules beyond the defaults that catch bugs or needlessly roundabout code.
opt_in_rules:
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discouraged_object_literal
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - legacy_random
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prohibited_super_call
  - reduce_into
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - weak_delegate
  - yoda_condition

line_length:
  warning: 140
  ignores_urls: true

identifier_name:
  excluded:
    - db  # the SQLite connection, as in SQLite's own API
    - id
    - up  # key up/down events
    - x
    - y

# Tuples of up to four (pixels, width, height, size) describe images.
large_tuple:
  warning: 4

cyclomatic_complexity:
  warning: 12
